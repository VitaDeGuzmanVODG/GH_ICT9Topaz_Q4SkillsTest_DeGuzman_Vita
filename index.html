<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Q4 Skills Test</title>
</head>
<style>
    .login-bg {
    background: #f2f2f2;
}

.login-container {
    width: 320px;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    margin: 100px auto;
    color: white;
    padding: 20px;
    background: #324685;
    border-radius: 15px;
}

.logo {
    width: 80px;
    display: block;
    margin: auto;
}

.sidebar {
    width: 220px;
    height: 100vh;
    background: #1f232a;
    color: white;
}

.sidebar a {
    display: block;
    color: white;
    text-decoration: none;
    margin: 15px 0;
}

.subject-card {
    padding: 15px;
    border-radius: 15px;
    background: #e9e9e9;
    transition: 0.3s;
}

.subject-card:hover {
    transform: scale (1.03);
}
</style>
<body class="login-bg">
    <div class="login-container shadow-lg">
        <img src="image.png" alt="Logo" class="mb-4" style="width: 100px;">
        <h1 class="text-center mt-3">Login</h1>
        
        <label>Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username">
        
        <label class="mt-2">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password">

        <button class="btn btn-primary w-100 mt-3" onclick="login()">Login</button>
        
        <p id="loginMsg" class="text-danger mt-2 text-center"></p>
    </div>
<script src="notebooks.html"></script>
<script src="main.js"></script>
</body>
</html>
